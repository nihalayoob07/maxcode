<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Max Code settings</title>
  <link rel="stylesheet" href="tutor.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <section class="home">
    <div class="homebox">
      <nav class="menu" role="tablist">
        <button role="tab" data-tab="general">General</button>
        <button role="tab" data-tab="voice">Voice</button>
        <button role="tab" data-tab="keys">Keys</button>
      </nav>
      <div class="panes">
        <div class="pane" data-pane="general">
          <label class="opt">Your level <select id="level"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="expert">Expert</option></select></label>
          <label class="opt">Theme <select id="theme"><option value="system">Same as Windows</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
          <label class="opt">Call Max <input id="call" class="keys" readonly title="Click, then press the keys you want"></label>
          <div class="msg" id="callMsg"></div>
          <label class="opt"><input type="checkbox" id="onTop"> Keep on top of other windows</label>
          <label class="opt"><input type="checkbox" id="login"> Start with Windows</label>
          <button class="btn" id="quit">Quit Max Code</button>
        </div>
        <div class="pane" data-pane="voice">
          <label class="opt"><input type="checkbox" id="wake"> Answer when I say “Max”</label>
          <label class="opt">Talk to Max <input id="talk" class="keys" readonly title="Click, then press the keys you want"></label>
          <div class="msg" id="talkMsg"></div>
          <p class="aside">Max hears you on this PC; nothing you say leaves it unless you add an ElevenLabs key.</p>
        </div>
        <div class="pane" data-pane="keys">
          <label class="lab">NVIDIA API key <span>(optional)</span> <a href="#" id="getKey">get one free</a></label>
          <div class="row">
            <input id="key" type="password" placeholder="nvapi-…" autocomplete="off" spellcheck="false">
            <button class="btn p" id="saveKey">Save</button>
          </div>
          <div class="msg" id="keyMsg"></div>
          <label class="lab">ElevenLabs key <span>(optional)</span> <a href="#" id="getVoiceKey">get one</a></label>
          <div class="row">
            <input id="voiceKey" type="password" placeholder="sk_…" autocomplete="off" spellcheck="false">
            <button class="btn p" id="saveVoiceKey">Save</button>
          </div>
          <div class="msg" id="voiceMsg"></div>
        </div>
      </div>
    </div>
  </section>
  <script src="settings.js"></script>
</body>
</html>
